# Read-only guarantee (see docs/ARCHITECTURE.md, "Read-only guarantees").
# Library/binary code must never write, rename or delete anything except the
# user-requested --output report file. Test helpers that tag *temporary copies*
# of fixtures opt out locally with #[allow(clippy::disallowed_methods)].
#
# The --output report is written by render::OutputTarget with raw libc calls
# relative to the validated output directory handle: openat(O_CREAT|O_EXCL|
# O_NOFOLLOW) of a temp file, renameat over the destination, unlinkat of the temp
# file on failure. libc rename/renameat/unlink/unlinkat/creat are banned below and
# allowed only on OutputTarget::write_with. libc::open/openat cannot be banned
# (they are also used read-only, e.g. O_PATH directory handles), so by convention
# only OutputTarget::create_temp passes O_CREAT; review enforces this.
disallowed-methods = [
    { path = "std::fs::remove_file", reason = "liner is read-only" },
    { path = "std::fs::remove_dir", reason = "liner is read-only" },
    { path = "std::fs::remove_dir_all", reason = "liner is read-only" },
    { path = "std::fs::rename", reason = "liner is read-only" },
    { path = "std::fs::copy", reason = "liner is read-only" },
    { path = "std::fs::set_permissions", reason = "liner is read-only" },
    { path = "std::fs::write", reason = "liner is read-only; only render::OutputTarget may create files (via libc)" },
    { path = "std::fs::File::create", reason = "liner is read-only; only render::OutputTarget may create files (via libc)" },
    { path = "std::fs::File::create_new", reason = "liner is read-only; only render::OutputTarget may create files (via libc)" },
    { path = "std::fs::OpenOptions::new", reason = "liner is read-only; only render::OutputTarget may create files (via libc)" },
    { path = "libc::rename", reason = "liner is read-only" },
    { path = "libc::renameat", reason = "liner is read-only; only render::OutputTarget may rename" },
    { path = "libc::unlink", reason = "liner is read-only" },
    { path = "libc::unlinkat", reason = "liner is read-only; only render::OutputTarget may remove its temp file" },
    { path = "libc::creat", reason = "liner is read-only" },
    { path = "lofty::file::AudioFile::save_to_path", reason = "liner never writes tags" },
    { path = "lofty::file::AudioFile::save_to", reason = "liner never writes tags" },
    { path = "lofty::tag::TagExt::save_to_path", reason = "liner never writes tags" },
    { path = "lofty::tag::TagExt::save_to", reason = "liner never writes tags" },
    { path = "lofty::tag::TagExt::remove_from_path", reason = "liner never writes tags" },
    { path = "lofty::tag::TagExt::remove_from", reason = "liner never writes tags" },
    { path = "lofty::tag::TagType::remove_from_path", reason = "liner never writes tags" },
    { path = "lofty::tag::TagType::remove_from", reason = "liner never writes tags" },
]
