[package]
name = "liner"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Read-only music library metadata linter"
license-file = "LICENSE"
publish = false

[lib]
name = "liner"
path = "src/lib.rs"

[[bin]]
name = "liner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
lofty = "0.25"
rayon = "1"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"
unicode-normalization = "0.1"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
